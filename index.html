<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilni tahrirlash — L.uz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #ffffff;
        }

        .edit-card {
            width: 100%;
            max-width: 480px;
            background-color: #000000;
            position: relative;
            padding-bottom: 100px;
        }

        /* Yuqori bar */
        .top-bar {
            position: sticky;
            top: 0;
            width: 100%;
            padding: 14px 16px;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 40;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #16181c;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease;
        }

        .icon-btn:active {
            transform: scale(0.92);
            background-color: #25282e;
        }

        .page-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        /* Banner tahrirlash */
        .banner-wrapper {
            height: 120px;
            background-color: #1a2436;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.75);
            transition: filter 0.2s ease;
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
        }

        .banner-wrapper:active .camera-circle,
        .avatar-wrapper:active .camera-circle {
            transform: scale(0.9);
        }

        /* Avatar tahrirlash (profil sahifasi bilan bir xil joylashuv) */
        .avatar-wrapper {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            background-color: #222222;
            border: 5px solid #000000;
            position: absolute;
            left: 20px;
            top: 124px;
            z-index: 30;
            overflow: hidden;
            cursor: pointer;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.75);
        }

        .avatar-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Pastki qora panel */
        .bottom-sheet {
            background-color: #000000;
            border-top-left-radius: 18px;
            border-top-right-radius: 18px;
            margin-top: -16px;
            position: relative;
            z-index: 20;
            padding: 64px 20px 20px 20px;
        }

        /* Forma maydonlari */
        .form-group {
            margin-bottom: 18px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #71767b;
        }

        .char-count {
            font-size: 12px;
            color: #71767b;
        }

        .input-box {
            width: 100%;
            background-color: #121316;
            border: 1.5px solid #26292e;
            border-radius: 14px;
            padding: 13px 15px;
            color: #ffffff;
            font-size: 15.5px;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .input-box:focus {
            border-color: #ffffff;
            background-color: #16181c;
        }

        .username-field {
            display: flex;
            align-items: center;
            background-color: #121316;
            border: 1.5px solid #26292e;
            border-radius: 14px;
            padding: 0 15px;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .username-field:focus-within {
            border-color: #ffffff;
            background-color: #16181c;
        }

        .at-prefix {
            color: #71767b;
            font-size: 15.5px;
            font-weight: 600;
            margin-right: 2px;
            user-select: none;
        }

        .username-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 13px 0;
            color: #ffffff;
            font-size: 15.5px;
            outline: none;
        }

        textarea.input-box {
            resize: none;
            min-height: 92px;
            line-height: 1.4;
        }

        .status-text {
            font-size: 12.5px;
            margin-top: 6px;
            min-height: 16px;
        }

        .status-error {
            color: #f4212e;
        }

        .status-ok {
            color: #00ba7c;
        }

        /* Pastki o'ng burchakdagi Saqlash tugmasi */
        .floating-save-wrap {
            position: fixed;
            bottom: 22px;
            width: 100%;
            max-width: 480px;
            padding: 0 20px;
            display: flex;
            justify-content: flex-end;
            pointer-events: none;
            z-index: 50;
        }

        .btn-save {
            pointer-events: auto;
            height: 46px;
            padding: 0 26px;
            border-radius: 9999px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            font-size: 15.5px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75);
            transition: opacity 0.2s ease, transform 0.15s ease, background-color 0.2s ease;
        }

        .btn-save:active:not(:disabled) {
            transform: scale(0.95);
        }

        .btn-save:disabled {
            background-color: #2f3336;
            color: #71767b;
            cursor: not-allowed;
        }

        /* Toast xabarnoma */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            background-color: #1d1f23;
            color: #ffffff;
            border: 1px solid #333639;
            padding: 10px 18px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 60;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

<div class="edit-card">
    <!-- Yuqori panel -->
    <div class="top-bar">
        <div class="top-left">
            <button class="icon-btn" id="backBtn" aria-label="Orqaga">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <h1 class="page-title">Profilni tahrirlash</h1>
        </div>
    </div>

    <!-- Banner yuklash -->
    <div class="banner-wrapper" onclick="document.getElementById('bannerInput').click()">
        <img class="banner-img" id="bannerPreview" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80" alt="Banner">
        <div class="banner-overlay">
            <div class="camera-circle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
            </div>
        </div>
        <input type="file" id="bannerInput" accept="image/*">
    </div>

    <!-- Avatar yuklash -->
    <div class="avatar-wrapper" onclick="document.getElementById('avatarInput').click()">
        <img id="avatarPreview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Avatar">
        <div class="avatar-overlay">
            <div class="camera-circle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
            </div>
        </div>
        <input type="file" id="avatarInput" accept="image/*">
    </div>

    <!-- Tahrirlash maydonlari -->
    <div class="bottom-sheet">
        <!-- Ism -->
        <div class="form-group">
            <div class="label-row">
                <label class="form-label" for="nameInput">Ism</label>
                <span class="char-count" id="nameCount">9/30</span>
            </div>
            <input type="text" id="nameInput" class="input-box" maxlength="30" value="Javlonbek" placeholder="Ismingizni kiriting">
            <div class="status-text" id="nameStatus"></div>
        </div>

        <!-- Foydalanuvchi nomi -->
        <div class="form-group">
            <div class="label-row">
                <label class="form-label" for="usernameInput">Foydalanuvchi nomi</label>
                <span class="char-count" id="usernameCount">9/20</span>
            </div>
            <div class="username-field">
                <span class="at-prefix">@</span>
                <input type="text" id="usernameInput" class="username-input" maxlength="20" value="javlonbek" placeholder="username" autocomplete="off" autocapitalize="none">
            </div>
            <div class="status-text" id="usernameStatus"></div>
        </div>

        <!-- Bio -->
        <div class="form-group">
            <div class="label-row">
                <label class="form-label" for="bioInput">Bio</label>
                <span class="char-count" id="bioCount">49/140</span>
            </div>
            <textarea id="bioInput" class="input-box" maxlength="140" placeholder="O'zingiz haqingizda qisqacha...">Kutmagan odamlarimdan kutilmagan zarbalar oldim</textarea>
        </div>
    </div>

    <!-- Pastki o'ng burchakdagi Saqlash tugmasi -->
    <div class="floating-save-wrap">
        <button class="btn-save" id="saveBtn" disabled>Saqlash</button>
    </div>

    <!-- Xabarnoma -->
    <div class="toast" id="toast">O'zgarishlar saqlandi</div>
</div>

<script>
    const nameInput = document.getElementById('nameInput');
    const usernameInput = document.getElementById('usernameInput');
    const bioInput = document.getElementById('bioInput');

    const nameCount = document.getElementById('nameCount');
    const usernameCount = document.getElementById('usernameCount');
    const bioCount = document.getElementById('bioCount');

    const nameStatus = document.getElementById('nameStatus');
    const usernameStatus = document.getElementById('usernameStatus');

    const avatarInput = document.getElementById('avatarInput');
    const bannerInput = document.getElementById('bannerInput');
    const avatarPreview = document.getElementById('avatarPreview');
    const bannerPreview = document.getElementById('bannerPreview');

    const saveBtn = document.getElementById('saveBtn');
    const toast = document.getElementById('toast');
    const backBtn = document.getElementById('backBtn');

    // Dastlabki holat (o'zgarishlarni kuzatish uchun)
    let initialState = {
        name: nameInput.value.trim(),
        username: usernameInput.value.trim(),
        bio: bioInput.value.trim(),
        avatarChanged: false,
        bannerChanged: false
    };

    // Rasmni siqish (mobil xotira va yuklash tezligi uchun)
    function compressImage(file, maxWidth, maxHeight, callback) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width = Math.round(width * ratio);
                    height = Math.round(height * ratio);
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.82));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    avatarInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        compressImage(file, 300, 300, (dataUrl) => {
            avatarPreview.src = dataUrl;
            initialState.avatarChanged = true;
            validateAndCheckChanges();
        });
    });

    bannerInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        compressImage(file, 900, 360, (dataUrl) => {
            bannerPreview.src = dataUrl;
            initialState.bannerChanged = true;
            validateAndCheckChanges();
        });
    });

    function validateAndCheckChanges() {
        const nameVal = nameInput.value.trim();
        // Faqat kichik lotin harflari, raqamlar va pastki chiziq
        usernameInput.value = usernameInput.value.toLowerCase().replace(/[^a-z0-9_]/g, '');
        const userVal = usernameInput.value;
        const bioVal = bioInput.value;

        nameCount.textContent = `${nameInput.value.length}/30`;
        usernameCount.textContent = `${userVal.length}/20`;
        bioCount.textContent = `${bioVal.length}/140`;

        let isValid = true;

        if (nameVal.length === 0) {
            nameStatus.textContent = "Ism kiritilishi shart";
            nameStatus.className = "status-text status-error";
            isValid = false;
        } else {
            nameStatus.textContent = "";
        }

        if (userVal.length < 1 || userVal.length > 20) {
            usernameStatus.textContent = "1 dan 20 tagacha belgi kiriting";
            usernameStatus.className = "status-text status-error";
            isValid = false;
        } else {
            usernameStatus.textContent = "";
        }

        const hasChanged =
            nameVal !== initialState.name ||
            userVal !== initialState.username ||
            bioVal.trim() !== initialState.bio ||
            initialState.avatarChanged ||
            initialState.bannerChanged;

        saveBtn.disabled = !(isValid && hasChanged);
    }

    nameInput.addEventListener('input', validateAndCheckChanges);
    usernameInput.addEventListener('input', validateAndCheckChanges);
    bioInput.addEventListener('input', validateAndCheckChanges);

    saveBtn.addEventListener('click', () => {
        if (saveBtn.disabled) return;

        // Yangi holatni saqlash
        initialState = {
            name: nameInput.value.trim(),
            username: usernameInput.value.trim(),
            bio: bioInput.value.trim(),
            avatarChanged: false,
            bannerChanged: false
        };

        saveBtn.disabled = true;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2200);
    });

    backBtn.addEventListener('click', () => {
        if (window.history.length > 1) {
            window.history.back();
        }
    });

    validateAndCheckChanges();
</script>

</body>
</html>
