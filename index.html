<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОТП Банк — Профиль</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #ffffff;
        }

        .profile-card {
            width: 100%;
            max-width: 480px;
            background-color: #191919;
            overflow: hidden;
            position: relative;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
        }

        /* Yuqori laym-yashil to'lqinli banner[span_0](start_span)[span_0](end_span) */
        .banner {
            height: 235px;
            background-color: #b4ff00;
            position: relative;
            overflow: hidden;
        }

        .banner-bg-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Yuqori boshqaruv tugmalari[span_1](start_span)[span_1](end_span) */
        .top-controls {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 15;
        }

        .right-controls {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: rgba(76, 102, 12, 0.42);
            backdrop-filter: blur(4px);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Markazdagi matn va 3D grafik elementlar[span_2](start_span)[span_2](end_span) */
        .banner-content {
            position: relative;
            z-index: 6;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-left: 16px;
            padding-bottom: 18px;
        }

        .banner-text {
            color: #000000;
            font-weight: 900;
            line-height: 0.9;
            text-align: center;
            position: relative;
        }

        .text-line-1 {
            font-size: 48px;
            letter-spacing: -1.5px;
            margin-left: 20px;
        }

        .text-line-2 {
            font-size: 38px;
            letter-spacing: -1px;
        }

        .text-line-3 {
            font-size: 50px;
            font-style: italic;
            letter-spacing: -1.5px;
            position: relative;
            margin-top: 2px;
        }

        /* "ОТП" yozuvi orqasidagi kontur[span_3](start_span)[span_3](end_span) */
        .text-line-3::after {
            content: "ОТП";
            position: absolute;
            left: 4px;
            top: 7px;
            color: transparent;
            -webkit-text-stroke: 1.1px rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        /* Chap tomondagi binafsha 3D yulduzcha[span_4](start_span)[span_4](end_span) */
        .sparkle-3d {
            position: absolute;
            left: -48px;
            top: 24px;
            width: 60px;
            height: 60px;
            filter: drop-shadow(2px 4px 6px rgba(65, 15, 115, 0.45));
        }

        /* O'ng tomondagi 3D binafsha OTP halqa[span_5](start_span)[span_5](end_span) */
        .ring-3d-wrapper {
            position: absolute;
            right: -18px;
            top: -12px;
            width: 145px;
            height: 145px;
            z-index: 4;
            pointer-events: none;
        }

        /* O'ng pastki burchakdagi A+ belgisi[span_6](start_span)[span_6](end_span) */
        .age-badge {
            position: absolute;
            right: 14px;
            bottom: 34px;
            background-color: rgba(88, 118, 16, 0.65);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 5px;
            z-index: 7;
        }

        /* Pastki qora panel[span_7](start_span)[span_7](end_span) */
        .bottom-sheet {
            background-color: #191919;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            margin-top: -22px;
            position: relative;
            z-index: 10;
            padding: 0 20px 28px 20px;
        }

        /* Dumaloq avatar va OTP logotipi[span_8](start_span)[span_8](end_span) */
        .avatar-container {
            width: 118px;
            height: 118px;
            border-radius: 50%;
            background-color: #b4ff00;
            border: 6px solid #191919;
            margin-top: -66px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Sarlavha va tasdiqlangan belgi[span_9](start_span)[span_9](end_span) */
        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
        }

        .bank-title {
            font-size: 26px;
            font-weight: 600;
            color: #f1f1f1;
            letter-spacing: -0.3px;
        }

        .verified-check {
            width: 20px;
            height: 20px;
            color: #4da3ff;
        }
    </style>
</head>
<body>

<div class="profile-card">
    <!-- Banner[span_10](start_span)[span_10](end_span) -->
    <div class="banner">
        <!-- To'lqinli yashil fon SVG[span_11](start_span)[span_11](end_span) -->
        <svg class="banner-bg-svg" viewBox="0 0 400 240" preserveAspectRatio="none">
            <defs>
                <pattern id="wavyPattern" x="0" y="0" width="40" height="80" patternUnits="userSpaceOnUse">
                    <path d="M 10 0 Q 25 20, 10 40 T 10 80" fill="none" stroke="#9be600" stroke-width="10" stroke-linecap="round"/>
                    <path d="M 30 0 Q 45 20, 30 40 T 30 80" fill="none" stroke="#a8f500" stroke-width="8" stroke-linecap="round"/>
                </pattern>
            </defs>
            <rect width="400" height="240" fill="#b4ff00"/>
            <rect width="400" height="240" fill="url(#wavyPattern)" opacity="0.75"/>
        </svg>

        <!-- Yuqori tugmalar[span_12](start_span)[span_12](end_span) -->
        <div class="top-controls">
            <button class="icon-btn" aria-label="Назад">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <div class="right-controls">
                <button class="icon-btn" aria-label="Уведомления">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </button>
                <button class="icon-btn" aria-label="Меню">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="5" r="2.2"/>
                        <circle cx="12" cy="12" r="2.2"/>
                        <circle cx="12" cy="19" r="2.2"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- O'ng tarafdagi 3D binafsha halqa SVG[span_13](start_span)[span_13](end_span) -->
        <svg class="ring-3d-wrapper" viewBox="0 0 140 140">
            <defs>
                <radialGradient id="purpleSphere" cx="35%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#f3e8ff"/>
                    <stop offset="35%" stop-color="#9333ea"/>
                    <stop offset="80%" stop-color="#581c87"/>
                    <stop offset="100%" stop-color="#3b0764"/>
                </radialGradient>
                <linearGradient id="purpleArc" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#d8b4fe"/>
                    <stop offset="50%" stop-color="#7e22ce"/>
                    <stop offset="100%" stop-color="#4c1d95"/>
                </linearGradient>
            </defs>
            <!-- Tashqi 3D yoy -->
            <path d="M 70 15 A 55 55 0 1 0 120 88" fill="none" stroke="url(#purpleArc)" stroke-width="18" stroke-linecap="round"/>
            <!-- Markaziy 3D shar -->
            <circle cx="70" cy="70" r="26" fill="url(#purpleSphere)"/>
            <!-- Yuqori o'ng kichik shar -->
            <circle cx="106" cy="34" r="14" fill="url(#purpleSphere)"/>
        </svg>

        <!-- Markazdagi matn va yulduzcha[span_14](start_span)[span_14](end_span) -->
        <div class="banner-content">
            <div class="banner-text">
                <svg class="sparkle-3d" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f5d0fe"/>
                            <stop offset="45%" stop-color="#a855f7"/>
                            <stop offset="100%" stop-color="#4c1d95"/>
                        </linearGradient>
                    </defs>
                    <path d="M50 2 C55 38, 62 45, 98 50 C62 55, 55 62, 50 98 C45 62, 38 55, 2 50 C38 45, 45 38, 50 2 Z" fill="url(#starGrad)" stroke="#e9d5ff" stroke-width="2"/>
                </svg>

                <div class="text-line-1">Всё</div>
                <div class="text-line-2">будет</div>
                <div class="text-line-3">ОТП</div>
            </div>
        </div>

        <div class="age-badge">A+</div>
    </div>

    <!-- Pastki qora panel[span_15](start_span)[span_15](end_span) -->
    <div class="bottom-sheet">
        <div class="avatar-container">
            <svg width="74" height="74" viewBox="0 0 100 100">
                <path d="M 50 14 A 36 36 0 1 0 84 62" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="14" fill="#000000"/>
                <circle cx="75" cy="27" r="9.5" fill="#000000"/>
            </svg>
        </div>

        <div class="title-row">
            <h1 class="bank-title">ОТП Банк</h1>
            <svg class="verified-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
    </div>
</div>

</body>
</html>
