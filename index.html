<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОТП Банк — Профиль</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #ffffff;
        }

        .profile-card {
            width: 100%;
            max-width: 480px;
            background-color: #191919;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Yuqori yashil banner[span_0](start_span)[span_0](end_span) */
        .banner {
            height: 230px;
            background-color: #aeff00;
            background-image: repeating-radial-gradient(
                circle at 0 0,
                transparent 0,
                #aeff00 18px
            ), repeating-linear-gradient(#9ee60066, #b8ff1a66);
            position: relative;
            overflow: hidden;
        }

        /* Bannerdagi to'lqinli naqshlar */
        .banner-waves {
            position: absolute;
            inset: 0;
            opacity: 0.35;
            background: repeating-linear-gradient(
                -45deg,
                #8ed600,
                #8ed600 12px,
                transparent 12px,
                transparent 24px
            );
        }

        /* Yuqori boshqaruv tugmalari[span_1](start_span)[span_1](end_span) */
        .top-controls {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .right-controls {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: rgba(70, 95, 10, 0.45);
            backdrop-filter: blur(4px);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Banner markazidagi matn va 3D elementlar[span_2](start_span)[span_2](end_span) */
        .banner-content {
            position: relative;
            z-index: 5;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-left: 20px;
            padding-bottom: 15px;
        }

        .banner-text {
            color: #000000;
            font-weight: 900;
            line-height: 0.92;
            text-align: center;
            position: relative;
        }

        .text-line-1 {
            font-size: 46px;
            letter-spacing: -1.5px;
            margin-left: 18px;
        }

        .text-line-2 {
            font-size: 38px;
            letter-spacing: -1px;
        }

        .text-line-3 {
            font-size: 48px;
            font-style: italic;
            letter-spacing: -1px;
            position: relative;
            margin-top: 2px;
        }

        /* Matn orqasidagi kontur chiziq[span_3](start_span)[span_3](end_span) */
        .text-line-3::after {
            content: "ОТП";
            position: absolute;
            left: 3px;
            top: 6px;
            color: transparent;
            -webkit-text-stroke: 1px rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        /* Chap tomondagi binafsha yulduzcha[span_4](start_span)[span_4](end_span) */
        .sparkle-3d {
            position: absolute;
            left: -46px;
            top: 22px;
            width: 58px;
            height: 58px;
            filter: drop-shadow(2px 4px 6px rgba(65, 15, 115, 0.45));
        }

        /* O'ng tomondagi 3D binafsha halqa[span_5](start_span)[span_5](end_span) */
        .ring-3d {
            position: absolute;
            right: -12px;
            top: -8px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 14px solid #8a4fd6;
            box-shadow:
                inset 0 4px 10px rgba(255, 255, 255, 0.65),
                inset 0 -6px 12px rgba(45, 12, 92, 0.8),
                0 8px 18px rgba(45, 12, 92, 0.45);
            z-index: 3;
        }

        .ring-3d-inner {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #e0baff, #7c3aed 55%, #3b0764 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .ring-3d-dot {
            position: absolute;
            top: -10px;
            right: 8px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f3e8ff, #7e22ce 60%, #3b0764 100%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.35);
        }

        /* O'ng pastki burchakdagi A+ belgisi[span_6](start_span)[span_6](end_span) */
        .age-badge {
            position: absolute;
            right: 14px;
            bottom: 34px;
            background-color: rgba(85, 115, 15, 0.65);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 5px;
            z-index: 6;
        }

        /* Pastki qora qism[span_7](start_span)[span_7](end_span) */
        .bottom-sheet {
            background-color: #191919;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            margin-top: -22px;
            position: relative;
            z-index: 8;
            padding: 0 20px 28px 20px;
        }

        /* Dumaloq avatar va OTP logotipi[span_8](start_span)[span_8](end_span) */
        .avatar-container {
            width: 118px;
            height: 118px;
            border-radius: 50%;
            background-color: #aeff00;
            border: 6px solid #191919;
            margin-top: -66px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Sarlavha va tasdiqlangan belgi[span_9](start_span)[span_9](end_span) */
        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
        }

        .bank-title {
            font-size: 26px;
            font-weight: 600;
            color: #f1f1f1;
            letter-spacing: -0.3px;
        }

        .verified-check {
            width: 20px;
            height: 20px;
            color: #4da3ff;
        }
    </style>
</head>
<body>

<div class="profile-card">
    <!-- Banner qismi[span_10](start_span)[span_10](end_span) -->
    <div class="banner">
        <div class="banner-waves"></div>

        <!-- Yuqori tugmalar[span_11](start_span)[span_11](end_span) -->
        <div class="top-controls">
            <button class="icon-btn" aria-label="Назад">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <div class="right-controls">
                <button class="icon-btn" aria-label="Уведомления">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </button>
                <button class="icon-btn" aria-label="Меню">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="5" r="2.2"/>
                        <circle cx="12" cy="12" r="2.2"/>
                        <circle cx="12" cy="19" r="2.2"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- O'ng tarafdagi 3D element[span_12](start_span)[span_12](end_span) -->
        <div class="ring-3d">
            <div class="ring-3d-inner"></div>
            <div class="ring-3d-dot"></div>
        </div>

        <!-- Markazdagi matn va yulduzcha[span_13](start_span)[span_13](end_span) -->
        <div class="banner-content">
            <div class="banner-text">
                <!-- 4 qirrali 3D yulduzcha SVG[span_14](start_span)[span_14](end_span) -->
                <svg class="sparkle-3d" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f5d0fe"/>
                            <stop offset="45%" stop-color="#a855f7"/>
                            <stop offset="100%" stop-color="#4c1d95"/>
                        </linearGradient>
                    </defs>
                    <path d="M50 2 C55 38, 62 45, 98 50 C62 55, 55 62, 50 98 C45 62, 38 55, 2 50 C38 45, 45 38, 50 2 Z" fill="url(#starGrad)" stroke="#e9d5ff" stroke-width="2"/>
                </svg>

                <div class="text-line-1">Всё</div>
                <div class="text-line-2">будет</div>
                <div class="text-line-3">ОТП</div>
            </div>
        </div>

        <div class="age-badge">A+</div>
    </div>

    <!-- Pastki qora panel[span_15](start_span)[span_15](end_span) -->
    <div class="bottom-sheet">
        <div class="avatar-container">
            <!-- ОТП Банк logotipi SVG[span_16](start_span)[span_16](end_span) -->
            <svg width="74" height="74" viewBox="0 0 100 100">
                <!-- Tashqi yarim doira -->
                <path d="M 50 14 A 36 36 0 1 0 84 62" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
                <!-- Markaziy qora doira -->
                <circle cx="50" cy="50" r="14" fill="#000000"/>
                <!-- Yuqori o'ng nuqta -->
                <circle cx="75" cy="27" r="9.5" fill="#000000"/>
            </svg>
        </div>

        <div class="title-row">
            <h1 class="bank-title">ОТП Банк</h1>
            <svg class="verified-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
    </div>
</div>

</body>
</html>
