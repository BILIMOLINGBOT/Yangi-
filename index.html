<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1-2-7-14-30 Takrorlash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #000000;
      --surface-color: #161618;
      --surface-elevated: #222225;
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
      --accent-orange: #FF9F0A;
      --accent-blue: #0A84FF;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 100px;
    }

    /* Translucent iOS Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 19px;
      transition: all 0.3s ease;
    }

    /* Olov o'chgan holat */
    .streak-pill .streak-icon {
      filter: grayscale(100%) opacity(0.4);
      transform: scale(0.95);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Olov yongan holat (1-kun qo'shilganda yoki Bajarildi bosilganda) */
    .streak-pill.lit {
      border-color: rgba(255, 159, 10, 0.55);
      background: rgba(255, 159, 10, 0.14);
      box-shadow: 0 0 22px rgba(255, 159, 10, 0.28);
    }

    .streak-pill.lit .streak-icon {
      filter: grayscale(0%) opacity(1);
      transform: scale(1.2);
    }

    .stats-badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface-color);
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
    }

    /* Main Content */
    .container {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    /* Mavzu + Bajarildi qatori */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-row {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.28s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .task-row.completing {
      opacity: 0;
      transform: translateX(28px) scale(0.96);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .stage-pill {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-blue);
      background: rgba(10, 132, 255, 0.15);
      padding: 4px 9px;
      border-radius: 8px;
    }

    .task-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .done-btn {
      flex-shrink: 0;
      background: var(--text-primary);
      color: #000000;
      border: none;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.2s ease;
    }

    .done-btn:active {
      transform: scale(0.92);
      background: var(--accent-orange);
      color: #000000;
    }

    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 20px;
      color: var(--text-secondary);
    }

    .empty-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 14px;
      max-width: 250px;
      line-height: 1.45;
    }

    /* Navbatdagilar */
    .upcoming-box {
      margin-top: 30px;
      padding-top: 18px;
      border-top: 1px solid var(--border-color);
    }

    .upcoming-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 14px;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .upcoming-left {
      color: var(--text-primary);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 10px;
    }

    .upcoming-right {
      flex-shrink: 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Floating Action Button (Yangi) */
    .fab-new {
      position: fixed;
      right: 20px;
      bottom: 26px;
      z-index: 20;
      background: var(--text-primary);
      color: #000000;
      border: none;
      border-radius: 999px;
      padding: 15px 24px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.85);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .fab-new:active {
      transform: scale(0.94);
    }

    /* iOS Bottom Sheet Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      display: flex;
      align-items: flex-end;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      background: var(--surface-color);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 14px 20px 34px;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 38px;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      margin: 0 auto 18px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .modal-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .input-field {
      width: 100%;
      background: var(--surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 15px 16px;
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
      margin-bottom: 14px;
    }

    .input-field:focus {
      border-color: var(--accent-blue);
    }

    .save-btn {
      width: 100%;
      background: var(--text-primary);
      color: #000000;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .save-btn:active {
      opacity: 0.85;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 40;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Yuqori panel: Olov (Streak) va Bugungi son -->
  <header class="header">
    <div class="streak-pill" id="streakPill">
      <span class="streak-icon">🔥</span>
      <span id="streakCount">0</span>
    </div>
    <div class="stats-badge" id="todayStats">Bugun: 0 ta</div>
  </header>

  <div class="toast" id="toast"></div>

  <main class="container">
    <div class="section-title" id="sectionTitle">Bugun takrorlanadi</div>
    <div class="task-list" id="taskList"></div>

    <div class="upcoming-box" id="upcomingBox" style="display: none;">
      <div class="section-title">Keyingi kunlar jadvali</div>
      <div id="upcomingList"></div>
    </div>
  </main>

  <!-- Pastki o'ng burchak: Yangi tugmasi -->
  <button class="fab-new" id="openModalBtn">
    <span>+</span> Yangi
  </button>

  <!-- Yangi mavzu kiritish oynasi -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-title">Bugun yangi nima o‘rgandingiz?</div>
      <div class="modal-sub">Bugun 1-kun hisoblanadi. Ertaga (2-kuni) Bajarildi tugmasi bilan chiqadi.</div>
      <input type="text" id="topicInput" class="input-field" placeholder="Mavzu nomini yozing..." autocomplete="off" />
      <button class="save-btn" id="saveTopicBtn">Saqlash (1-kun)</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#000000');
      tg.setBackgroundColor('#000000');
    }

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred(type);
      }
    }

    // Aniq mahalliy sana (YYYY-MM-DD)
    function formatLocalDate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDaysToDateStr(baseDateStr, daysToAdd) {
      const [y, m, d] = baseDateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + daysToAdd);
      return formatLocalDate(date);
    }

    function getTodayStr() {
      return formatLocalDate(new Date());
    }

    function getYesterdayStr() {
      return addDaysToDateStr(getTodayStr(), -1);
    }

    // 1-kun = kiritilgan kun (darhol hisoblanadi)
    // Keyingi bosqichlar: 2-kun (+1), 7-kun (+6), 14-kun (+13), 30-kun (+29)
    const REVIEW_STAGES = [2, 7, 14, 30];

    function getNextStage(currentStage) {
      const idx = REVIEW_STAGES.indexOf(currentStage);
      if (idx === -1 || idx === REVIEW_STAGES.length - 1) return 'completed';
      return REVIEW_STAGES[idx + 1];
    }

    let topics = JSON.parse(localStorage.getItem('sr_topics_v4') || '[]');
    let streakData = JSON.parse(localStorage.getItem('sr_streak_v4') || '{"count": 0, "lastDate": null}');

    function saveData() {
      localStorage.setItem('sr_topics_v4', JSON.stringify(topics));
      localStorage.setItem('sr_streak_v4', JSON.stringify(streakData));
    }

    function checkStreak() {
      const today = getTodayStr();
      const yesterday = getYesterdayStr();
      if (streakData.lastDate && streakData.lastDate !== today && streakData.lastDate !== yesterday) {
        streakData.count = 0;
        saveData();
      }
    }

    // Olovni yoqish (1-kun yangi kiritilganda ham, Bajarildi bosilganda ham)
    function igniteStreak() {
      const today = getTodayStr();
      if (streakData.lastDate !== today) {
        streakData.count += 1;
        streakData.lastDate = today;
        saveData();
      }
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function render() {
      checkStreak();
      const today = getTodayStr();

      // Streak holati
      document.getElementById('streakCount').textContent = streakData.count;
      const streakPill = document.getElementById('streakPill');
      if (streakData.lastDate === today && streakData.count > 0) {
        streakPill.classList.add('lit');
      } else {
        streakPill.classList.remove('lit');
      }

      // Bugun takrorlanadiganlar
      const dueTopics = topics.filter(t => t.stage !== 'completed' && t.nextReviewDate <= today);
      // Keyingi kunlardagilar
      const upcomingTopics = topics
        .filter(t => t.stage !== 'completed' && t.nextReviewDate > today)
        .sort((a, b) => a.nextReviewDate.localeCompare(b.nextReviewDate));

      document.getElementById('todayStats').textContent = `Bugun: ${dueTopics.length} ta`;

      const listEl = document.getElementById('taskList');
      const sectionTitle = document.getElementById('sectionTitle');
      listEl.innerHTML = '';

      if (dueTopics.length === 0) {
        sectionTitle.style.display = 'none';
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">Bugungi takrorlashlar yo‘q</div>
            <div class="empty-desc">Yangi o‘rgangan mavzuni kiritish uchun <b>+ Yangi</b> tugmasini bosing.</div>
          </div>
        `;
      } else {
        sectionTitle.style.display = 'block';
        dueTopics.forEach(topic => {
          const row = document.createElement('div');
          row.className = 'task-row';
          row.id = `row-${topic.id}`;

          row.innerHTML = `
            <div class="task-left">
              <span class="stage-pill">${topic.stage}-kun</span>
              <span class="task-title">${escapeHtml(topic.title)}</span>
            </div>
            <button class="done-btn" onclick="completeTopic('${topic.id}')">Bajarildi</button>
          `;
          listEl.appendChild(row);
        });
      }

      // Navbatdagilar jadvali
      const upcomingBox = document.getElementById('upcomingBox');
      const upcomingList = document.getElementById('upcomingList');
      if (upcomingTopics.length > 0) {
        upcomingBox.style.display = 'block';
        upcomingList.innerHTML = upcomingTopics.map(t => `
          <div class="upcoming-item">
            <span class="upcoming-left">${escapeHtml(t.title)}</span>
            <span class="upcoming-right">${t.stage}-kun (${t.nextReviewDate})</span>
          </div>
        `).join('');
      } else {
        upcomingBox.style.display = 'none';
      }
    }

    // Mavzu oldidagi "Bajarildi" tugmasi bosilganda
    window.completeTopic = function(id) {
      const topic = topics.find(t => t.id === id);
      if (!topic) return;

      haptic('success');
      const row = document.getElementById(`row-${id}`);
      if (row) row.classList.add('completing');

      const nextStage = getNextStage(topic.stage);

      setTimeout(() => {
        if (nextStage === 'completed') {
          topic.stage = 'completed';
          showToast('🔥 30 kunlik takrorlash tugadi!');
        } else {
          topic.stage = nextStage;
          topic.nextReviewDate = addDaysToDateStr(topic.learnedDate, nextStage - 1);
          showToast(`🔥 Olov yondi! Keyingisi: ${nextStage}-kuni`);
        }

        igniteStreak();
        saveData();
        render();
      }, 240);
    };

    // Modal oynani ochish/yopish
    const modalBackdrop = document.getElementById('modalBackdrop');
    const topicInput = document.getElementById('topicInput');

    document.getElementById('openModalBtn').addEventListener('click', () => {
      haptic('medium');
      modalBackdrop.classList.add('open');
      setTimeout(() => topicInput.focus(), 150);
    });

    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) modalBackdrop.classList.remove('open');
    });

    topicInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('saveTopicBtn').click();
    });

    // "+ Yangi" saqlanganda: 1-kun hisoblanadi va 🔥 darhol yonadi!
    document.getElementById('saveTopicBtn').addEventListener('click', () => {
      const title = topicInput.value.trim();
      if (!title) {
        haptic('light');
        topicInput.focus();
        return;
      }

      haptic('success');
      const today = getTodayStr();
      const day2Date = addDaysToDateStr(today, 1);

      topics.unshift({
        id: Date.now().toString(),
        title,
        learnedDate: today,       // Bugun = 1-kun bajarildi
        stage: 2,                 // Keyingi takrorlash = 2-kun (ertaga)
        nextReviewDate: day2Date
      });

      // 1-kun kiritilgani uchun olovni darhol yoqish
      igniteStreak();
      saveData();

      topicInput.value = '';
      modalBackdrop.classList.remove('open');
      showToast('🔥 1-kun hisoblandi! Ertaga (2-kuni) chiqadi');
      render();
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    render();
  </script>
</body>
</html>
