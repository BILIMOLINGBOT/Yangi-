<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1-2-7-14-30 Takrorlash</title>
  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #000000;
      --surface-color: #161618;
      --surface-elevated: #222225;
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
      --accent-green: #30D158;
      --accent-orange: #FF9F0A;
      --accent-blue: #0A84FF;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 100px;
    }

    /* Translucent iOS Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 17px;
      transition: transform 0.2s ease;
    }

    .streak-pill.active {
      border-color: rgba(255, 159, 10, 0.35);
      box-shadow: 0 0 16px rgba(255, 159, 10, 0.15);
    }

    .streak-icon {
      font-size: 18px;
    }

    .stats-badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface-color);
      padding: 7px 12px;
      border-radius: 999px;
    }

    /* Main Content */
    .container {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    /* Task Cards */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .task-card.completing {
      opacity: 0;
      transform: translateX(30px) scale(0.96);
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .stage-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-blue);
      background: rgba(10, 132, 255, 0.14);
      padding: 3px 9px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .task-title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;
      word-wrap: break-word;
    }

    .task-note {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
      line-height: 1.4;
    }

    /* Bajarildi Button */
    .done-btn {
      background: var(--text-primary);
      color: #000000;
      border: none;
      border-radius: 14px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .done-btn:active {
      transform: scale(0.93);
      background: var(--accent-green);
      color: #000000;
    }

    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 44px;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 14px;
      max-width: 250px;
      line-height: 1.4;
    }

    /* Floating Action Button (Yangi) */
    .fab-new {
      position: fixed;
      right: 20px;
      bottom: 26px;
      z-index: 20;
      background: var(--text-primary);
      color: #000000;
      border: none;
      border-radius: 999px;
      padding: 15px 24px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.75);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .fab-new:active {
      transform: scale(0.94);
    }

    /* iOS Bottom Sheet Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      display: flex;
      align-items: flex-end;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      background: var(--surface-color);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 14px 20px 34px;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 38px;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      margin: 0 auto 18px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-field {
      width: 100%;
      background: var(--surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-blue);
    }

    .save-btn {
      width: 100%;
      background: var(--text-primary);
      color: #000000;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 6px;
      cursor: pointer;
    }

    .save-btn:active {
      opacity: 0.85;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 40;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Header: Streak va Bugungi holat -->
  <header class="header">
    <div class="streak-pill" id="streakPill">
      <span class="streak-icon">🔥</span>
      <span id="streakCount">0</span>
    </div>
    <div class="stats-badge" id="todayStats">Bugun: 0 ta</div>
  </header>

  <!-- Toast xabarnoma -->
  <div class="toast" id="toast">Keyingi takrorlash: 2-kun</div>

  <!-- Asosiy ro'yxat -->
  <main class="container">
    <div class="section-title" id="sectionTitle">Bugun takrorlanadi</div>
    <div class="task-list" id="taskList"></div>
  </main>

  <!-- Pastki o'ng burchak: Yangi tugmasi -->
  <button class="fab-new" id="openModalBtn">
    <span>+</span> Yangi
  </button>

  <!-- Yangi mavzu qo'shish oynasi -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-title">Yangi o‘rganilgan narsa</div>
      <div class="input-group">
        <input type="text" id="topicInput" class="input-field" placeholder="Nima o‘rgandingiz? (masalan: Modal verbs)" autocomplete="off" />
      </div>
      <div class="input-group">
        <input type="text" id="noteInput" class="input-field" placeholder="Qisqa izoh (ixtiyoriy)" autocomplete="off" />
      </div>
      <button class="save-btn" id="saveTopicBtn">Saqlash (1-kun boshlanadi)</button>
    </div>
  </div>

  <script>
    // Telegram WebApp inicializatsiyasi
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#000000');
      tg.setBackgroundColor('#000000');
    }

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred(type);
      }
    }

    // Sana funksiyalari (YYYY-MM-DD)
    function getTodayStr(offsetDays = 0) {
      const date = new Date();
      date.setDate(date.getDate() + offsetDays);
      return date.toISOString().split('T')[0];
    }

    // 1 - 2 - 7 - 14 - 30 intervallari
    const INTERVALS = [1, 2, 7, 14, 30];

    function getNextStageInfo(currentStage) {
      const idx = INTERVALS.indexOf(currentStage);
      if (idx === -1 || idx === INTERVALS.length - 1) {
        return { nextStage: 'completed', daysToAdd: 0 };
      }
      const nextStage = INTERVALS[idx + 1];
      const daysToAdd = nextStage - currentStage; // 1->2 (+1 kun), 2->7 (+5 kun), 7->14 (+7 kun), 14->30 (+16 kun)
      return { nextStage, daysToAdd };
    }

    // Ma'lumotlarni o'qish/saqlash (Keyinchalik Supabase bilan almashtiriladi)
    let topics = JSON.parse(localStorage.getItem('sr_topics') || '[]');
    let streakData = JSON.parse(localStorage.getItem('sr_streak') || '{"count": 0, "lastDate": null}');

    function saveData() {
      localStorage.setItem('sr_topics', JSON.stringify(topics));
      localStorage.setItem('sr_streak', JSON.stringify(streakData));
    }

    // Streak tekshirish (agar kecha ham, bugun ham bajarilmagan bo'lsa 0 ga tushadi)
    function checkStreak() {
      const today = getTodayStr(0);
      const yesterday = getTodayStr(-1);
      if (streakData.lastDate && streakData.lastDate !== today && streakData.lastDate !== yesterday) {
        streakData.count = 0;
        saveData();
      }
    }

    function incrementStreakIfNeeded() {
      const today = getTodayStr(0);
      if (streakData.lastDate !== today) {
        streakData.count += 1;
        streakData.lastDate = today;
        saveData();
      }
    }

    // Toast ko'rsatish
    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    // Ekranni chizish (Render)
    function render() {
      checkStreak();
      const today = getTodayStr(0);

      // Streak UI
      document.getElementById('streakCount').textContent = streakData.count;
      const streakPill = document.getElementById('streakPill');
      if (streakData.lastDate === today && streakData.count > 0) {
        streakPill.classList.add('active');
      } else {
        streakPill.classList.remove('active');
      }

      // Bugun takrorlanishi kerak bo'lgan mavzular
      const dueTopics = topics.filter(t => t.stage !== 'completed' && t.nextReviewDate <= today);
      document.getElementById('todayStats').textContent = `Bugun: ${dueTopics.length} ta`;

      const listEl = document.getElementById('taskList');
      const sectionTitle = document.getElementById('sectionTitle');
      listEl.innerHTML = '';

      if (dueTopics.length === 0) {
        sectionTitle.style.display = 'none';
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">✓</div>
            <div class="empty-title">Bugungi reja bajarildi</div>
            <div class="empty-desc">Yangi o‘rgangan narsangizni qo‘shish uchun pastdagi <b>+ Yangi</b> tugmasini bosing.</div>
          </div>
        `;
        return;
      }

      sectionTitle.style.display = 'block';

      dueTopics.forEach(topic => {
        const card = document.createElement('div');
        card.className = 'task-card';
        card.id = `card-${topic.id}`;

        card.innerHTML = `
          <div class="task-info">
            <span class="stage-tag">${topic.stage}-kun takrorlash</span>
            <div class="task-title">${escapeHtml(topic.title)}</div>
            ${topic.note ? `<div class="task-note">${escapeHtml(topic.note)}</div>` : ''}
          </div>
          <button class="done-btn" onclick="completeTopic('${topic.id}')">Bajarildi</button>
        `;
        listEl.appendChild(card);
      });
    }

    // Mavzuni "Bajarildi" qilish
    window.completeTopic = function(id) {
      const topic = topics.find(t => t.id === id);
      if (!topic) return;

      haptic('success');
      const card = document.getElementById(`card-${id}`);
      if (card) card.classList.add('completing');

      const { nextStage, daysToAdd } = getNextStageInfo(topic.stage);

      setTimeout(() => {
        if (nextStage === 'completed') {
          topic.stage = 'completed';
          showToast('🎉 30 kunlik sikl yakunlandi!');
        } else {
          topic.stage = nextStage;
          topic.nextReviewDate = getTodayStr(daysToAdd);
          showToast(`Keyingi eslatma: ${nextStage}-kuni`);
        }

        incrementStreakIfNeeded();
        saveData();
        render();
      }, 260);
    };

    // Modal oynani boshqarish
    const modalBackdrop = document.getElementById('modalBackdrop');
    const topicInput = document.getElementById('topicInput');
    const noteInput = document.getElementById('noteInput');

    document.getElementById('openModalBtn').addEventListener('click', () => {
      haptic('medium');
      modalBackdrop.classList.add('open');
      setTimeout(() => topicInput.focus(), 150);
    });

    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) {
        modalBackdrop.classList.remove('open');
      }
    });

    document.getElementById('saveTopicBtn').addEventListener('click', () => {
      const title = topicInput.value.trim();
      const note = noteInput.value.trim();

      if (!title) {
        haptic('light');
        topicInput.focus();
        return;
      }

      haptic('success');

      const newTopic = {
        id: Date.now().toString(),
        title,
        note,
        stage: 1, // 1-kun (bugun kiritilgan vaqtdan boshlanadi)
        nextReviewDate: getTodayStr(0),
        createdAt: new Date().toISOString()
      };

      topics.unshift(newTopic);
      saveData();

      topicInput.value = '';
      noteInput.value = '';
      modalBackdrop.classList.remove('open');
      showToast('Qo‘shildi! 1-kun takrorlash tayyor');
      render();
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Dastlabki ishga tushirish
    render();
  </script>
</body>
</html>
