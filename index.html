<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1-2-7-14-30 Takrorlash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #000000;
      --surface-color: #161618;
      --surface-elevated: #222225;
      --text-primary: #FFFFFF;
      --text-secondary: #8E8E93;
      --accent-green: #30D158;
      --accent-orange: #FF9F0A;
      --accent-blue: #0A84FF;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 100px;
    }

    /* Translucent iOS Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      padding: 8px 15px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 18px;
      transition: all 0.3s ease;
    }

    /* Olov o'chgan holat (bugun hali bajarilmagan) */
    .streak-pill .streak-icon {
      filter: grayscale(100%) opacity(0.45);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: scale(0.95);
    }

    /* Olov yongan holat (Bajarildi bosilganda) */
    .streak-pill.lit {
      border-color: rgba(255, 159, 10, 0.5);
      background: rgba(255, 159, 10, 0.12);
      box-shadow: 0 0 20px rgba(255, 159, 10, 0.25);
    }

    .streak-pill.lit .streak-icon {
      filter: grayscale(0%) opacity(1);
      transform: scale(1.18);
    }

    .stats-badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface-color);
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
    }

    /* Main Content */
    .container {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
      margin-bottom: 14px;
    }

    /* Task Cards */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .task-card.completing {
      opacity: 0;
      transform: translateX(30px) scale(0.96);
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .stage-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-blue);
      background: rgba(10, 132, 255, 0.15);
      padding: 3px 9px;
      border-radius: 8px;
    }

    .learned-date {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .task-title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;
      word-wrap: break-word;
    }

    .task-note {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
      line-height: 1.4;
    }

    /* Bajarildi Button */
    .done-btn {
      background: var(--text-primary);
      color: #000000;
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .done-btn:active {
      transform: scale(0.92);
      background: var(--accent-orange);
      color: #000000;
    }

    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 14px;
      max-width: 260px;
      line-height: 1.45;
    }

    /* Upcoming preview */
    .upcoming-box {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--border-color);
    }

    .upcoming-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 14px;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .upcoming-left {
      color: var(--text-primary);
      font-weight: 500;
    }

    .upcoming-right {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Floating Action Button (Yangi) */
    .fab-new {
      position: fixed;
      right: 20px;
      bottom: 26px;
      z-index: 20;
      background: var(--text-primary);
      color: #000000;
      border: none;
      border-radius: 999px;
      padding: 15px 24px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.8);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .fab-new:active {
      transform: scale(0.94);
    }

    /* iOS Bottom Sheet Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      display: flex;
      align-items: flex-end;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      background: var(--surface-color);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 14px 20px 34px;
      border-top: 1px solid var(--border-color);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-backdrop.open .modal-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 38px;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      margin: 0 auto 18px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .modal-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-field {
      width: 100%;
      background: var(--surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-blue);
    }

    .save-btn {
      width: 100%;
      background: var(--text-primary);
      color: #000000;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 6px;
      cursor: pointer;
    }

    .save-btn:active {
      opacity: 0.85;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 40;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Header: Streak va Bugungi holat -->
  <header class="header">
    <div class="streak-pill" id="streakPill">
      <span class="streak-icon">🔥</span>
      <span id="streakCount">0</span>
    </div>
    <div class="stats-badge" id="todayStats">Bugun: 0 ta</div>
  </header>

  <!-- Toast xabarnoma -->
  <div class="toast" id="toast"></div>

  <!-- Asosiy ro'yxat -->
  <main class="container">
    <div class="section-title" id="sectionTitle">Bugun takrorlanadi</div>
    <div class="task-list" id="taskList"></div>

    <!-- Kutilayotgan (ertaga va keyingi kunlar) ro'yxati -->
    <div class="upcoming-box" id="upcomingBox" style="display: none;">
      <div class="section-title">Navbatdagi takrorlashlar</div>
      <div id="upcomingList"></div>
    </div>
  </main>

  <!-- Pastki o'ng burchak: Yangi tugmasi -->
  <button class="fab-new" id="openModalBtn">
    <span>+</span> Yangi
  </button>

  <!-- Yangi mavzu qo'shish oynasi -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-title">Bugun yangi nima o‘rgandingiz?</div>
      <div class="modal-sub">Bugun 1-kun hisoblanadi. Ertaga (2-kuni) takrorlash uchun chiqadi.</div>
      <div class="input-group">
        <input type="text" id="topicInput" class="input-field" placeholder="Mavzu nomi (masalan: Present Perfect)" autocomplete="off" />
      </div>
      <div class="input-group">
        <input type="text" id="noteInput" class="input-field" placeholder="Qisqa izoh (ixtiyoriy)" autocomplete="off" />
      </div>
      <button class="save-btn" id="saveTopicBtn">Saqlash</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#000000');
      tg.setBackgroundColor('#000000');
    }

    function haptic(type = 'light') {
      if (tg?.HapticFeedback) {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred(type);
      }
    }

    // Telefonning aniq mahalliy sanasini olish (YYYY-MM-DD)
    function formatLocalDate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDaysToDateStr(baseDateStr, daysToAdd) {
      const [y, m, d] = baseDateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + daysToAdd);
      return formatLocalDate(date);
    }

    function getTodayStr() {
      return formatLocalDate(new Date());
    }

    function getYesterdayStr() {
      return addDaysToDateStr(getTodayStr(), -1);
    }

    // 1-kun = o'rganilgan kun (+0)
    // 2-kun = +1 kun
    // 7-kun = +6 kun
    // 14-kun = +13 kun
    // 30-kun = +29 kun
    const REVIEW_STAGES = [2, 7, 14, 30];

    function getNextStage(currentStage) {
      const idx = REVIEW_STAGES.indexOf(currentStage);
      if (idx === -1 || idx === REVIEW_STAGES.length - 1) {
        return 'completed';
      }
      return REVIEW_STAGES[idx + 1];
    }

    // Saqlangan ma'lumotlar
    let topics = JSON.parse(localStorage.getItem('sr_topics_v2') || '[]');
    let streakData = JSON.parse(localStorage.getItem('sr_streak_v2') || '{"count": 0, "lastDate": null}');

    function saveData() {
      localStorage.setItem('sr_topics_v2', JSON.stringify(topics));
      localStorage.setItem('sr_streak_v2', JSON.stringify(streakData));
    }

    // Streakni tekshirish
    function checkStreak() {
      const today = getTodayStr();
      const yesterday = getYesterdayStr();
      if (streakData.lastDate && streakData.lastDate !== today && streakData.lastDate !== yesterday) {
        streakData.count = 0;
        saveData();
      }
    }

    // "Bajarildi" bosilganda olovni (🔥) yoqish
    function lightFireStreak() {
      const today = getTodayStr();
      if (streakData.lastDate !== today) {
        streakData.count += 1;
        streakData.lastDate = today;
        saveData();
      }
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function render() {
      checkStreak();
      const today = getTodayStr();

      // Streak UI (olov bugun bajarilganda yonadi)
      document.getElementById('streakCount').textContent = streakData.count;
      const streakPill = document.getElementById('streakPill');
      if (streakData.lastDate === today && streakData.count > 0) {
        streakPill.classList.add('lit');
      } else {
        streakPill.classList.remove('lit');
      }

      // Bugun takrorlanishi kerak bo'lganlar (nextReviewDate <= bugun)
      const dueTopics = topics.filter(t => t.stage !== 'completed' && t.nextReviewDate <= today);
      // Kelajakdagi takrorlashlar (nextReviewDate > bugun)
      const upcomingTopics = topics
        .filter(t => t.stage !== 'completed' && t.nextReviewDate > today)
        .sort((a, b) => a.nextReviewDate.localeCompare(b.nextReviewDate));

      document.getElementById('todayStats').textContent = `Bugun: ${dueTopics.length} ta`;

      const listEl = document.getElementById('taskList');
      const sectionTitle = document.getElementById('sectionTitle');
      listEl.innerHTML = '';

      if (dueTopics.length === 0) {
        sectionTitle.style.display = 'none';
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">✓</div>
            <div class="empty-title">Bugungi takrorlashlar yo‘q</div>
            <div class="empty-desc">Bugun o‘rgangan yangi narsangizni kiritish uchun <b>+ Yangi</b> tugmasini bosing.</div>
          </div>
        `;
      } else {
        sectionTitle.style.display = 'block';
        dueTopics.forEach(topic => {
          const card = document.createElement('div');
          card.className = 'task-card';
          card.id = `card-${topic.id}`;

          card.innerHTML = `
            <div class="task-info">
              <div class="meta-row">
                <span class="stage-tag">${topic.stage}-kun takrorlash</span>
                <span class="learned-date">1-kun: ${topic.learnedDate}</span>
              </div>
              <div class="task-title">${escapeHtml(topic.title)}</div>
              ${topic.note ? `<div class="task-note">${escapeHtml(topic.note)}</div>` : ''}
            </div>
            <button class="done-btn" onclick="completeTopic('${topic.id}')">Bajarildi</button>
          `;
          listEl.appendChild(card);
        });
      }

      // Kelajakdagi ro'yxat (foydalanuvchi yangi kiritgan narsasi ertaga 2-kuni chiqishini ko'rib turishi uchun)
      const upcomingBox = document.getElementById('upcomingBox');
      const upcomingList = document.getElementById('upcomingList');
      if (upcomingTopics.length > 0) {
        upcomingBox.style.display = 'block';
        upcomingList.innerHTML = upcomingTopics.map(t => `
          <div class="upcoming-item">
            <span class="upcoming-left">${escapeHtml(t.title)}</span>
            <span class="upcoming-right">${t.stage}-kun • ${t.nextReviewDate}</span>
          </div>
        `).join('');
      } else {
        upcomingBox.style.display = 'none';
      }
    }

    // "Bajarildi" bosilganda
    window.completeTopic = function(id) {
      const topic = topics.find(t => t.id === id);
      if (!topic) return;

      haptic('success');
      const card = document.getElementById(`card-${id}`);
      if (card) card.classList.add('completing');

      const nextStage = getNextStage(topic.stage);

      setTimeout(() => {
        if (nextStage === 'completed') {
          topic.stage = 'completed';
          showToast('🔥 30 kunlik takrorlash to‘liq tugadi!');
        } else {
          topic.stage = nextStage;
          // Har doim 1-kuni o'rganilgan sanadan (learnedDate) aniq hisoblanadi:
          // 2-kun (+1), 7-kun (+6), 14-kun (+13), 30-kun (+29)
          topic.nextReviewDate = addDaysToDateStr(topic.learnedDate, nextStage - 1);
          showToast(`🔥 Bajarildi! Keyingisi: ${nextStage}-kuni (${topic.nextReviewDate})`);
        }

        // Olovni yoqish
        lightFireStreak();
        saveData();
        render();
      }, 250);
    };

    // Modal oynani boshqarish
    const modalBackdrop = document.getElementById('modalBackdrop');
    const topicInput = document.getElementById('topicInput');
    const noteInput = document.getElementById('noteInput');

    document.getElementById('openModalBtn').addEventListener('click', () => {
      haptic('medium');
      modalBackdrop.classList.add('open');
      setTimeout(() => topicInput.focus(), 150);
    });

    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) {
        modalBackdrop.classList.remove('open');
      }
    });

    // Yangi narsa kiritish (1-kun sifatida saqlanadi, ertaga 2-kuni chiqadi)
    document.getElementById('saveTopicBtn').addEventListener('click', () => {
      const title = topicInput.value.trim();
      const note = noteInput.value.trim();

      if (!title) {
        haptic('light');
        topicInput.focus();
        return;
      }

      haptic('success');
      const today = getTodayStr();
      const day2Date = addDaysToDateStr(today, 1); // Ertaga = 2-kun

      const newTopic = {
        id: Date.now().toString(),
        title,
        note,
        learnedDate: today,       // 1-kun (o'rganilgan sana)
        stage: 2,                 // Birinchi takrorlash 2-kuni bo'ladi
        nextReviewDate: day2Date  // Ertaga ekranda chiqadi
      };

      topics.unshift(newTopic);
      saveData();

      topicInput.value = '';
      noteInput.value = '';
      modalBackdrop.classList.remove('open');
      showToast(`Saqlandi! Ertaga (2-kuni) takrorlashga chiqadi`);
      render();
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    render();
  </script>
</body>
</html>
