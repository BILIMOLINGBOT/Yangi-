<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОТП Банк — Профиль</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #ffffff;
        }

        .profile-card {
            width: 100%;
            max-width: 480px;
            background-color: #000000;
            overflow: hidden;
            position: relative;
        }

        /* Yuqori yashil to'lqinli banner */
        .banner {
            height: 230px;
            background-color: #b4ff00;
            position: relative;
            overflow: hidden;
        }

        .banner-bg-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Yuqori boshqaruv tugmalari */
        .top-controls {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 15;
        }

        .right-controls {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: rgba(76, 102, 12, 0.42);
            backdrop-filter: blur(4px);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Markazdagi matn va 3D elementlar */
        .banner-content {
            position: relative;
            z-index: 6;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-left: 16px;
            padding-bottom: 18px;
        }

        .banner-text {
            color: #000000;
            font-weight: 900;
            line-height: 0.9;
            text-align: center;
            position: relative;
        }

        .text-line-1 {
            font-size: 48px;
            letter-spacing: -1.5px;
            margin-left: 20px;
        }

        .text-line-2 {
            font-size: 38px;
            letter-spacing: -1px;
        }

        .text-line-3 {
            font-size: 50px;
            font-style: italic;
            letter-spacing: -1.5px;
            position: relative;
            margin-top: 2px;
        }

        /* "ОТП" yozuvi orqasidagi kontur */
        .text-line-3::after {
            content: "ОТП";
            position: absolute;
            left: 4px;
            top: 7px;
            color: transparent;
            -webkit-text-stroke: 1.1px rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        /* Chap tomondagi binafsha 3D yulduzcha */
        .sparkle-3d {
            position: absolute;
            left: -48px;
            top: 24px;
            width: 60px;
            height: 60px;
            filter: drop-shadow(2px 4px 6px rgba(65, 15, 115, 0.45));
        }

        /* O'ng tomondagi 3D binafsha halqa */
        .ring-3d-wrapper {
            position: absolute;
            right: -18px;
            top: -12px;
            width: 145px;
            height: 145px;
            z-index: 4;
            pointer-events: none;
        }

        /* O'ng pastki burchakdagi A+ belgisi */
        .age-badge {
            position: absolute;
            right: 14px;
            bottom: 34px;
            background-color: rgba(88, 118, 16, 0.65);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 5px;
            z-index: 7;
        }

        /* Pastki qora panel */
        .bottom-sheet {
            background-color: #000000;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            margin-top: -22px;
            position: relative;
            z-index: 10;
            padding: 0 20px 18px 20px;
        }

        /* Dumaloq avatar va OTP logotipi */
        .avatar-container {
            width: 118px;
            height: 118px;
            border-radius: 50%;
            background-color: #b4ff00;
            border: 6px solid #000000;
            margin-top: -66px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Sarlavha va tasdiqlangan belgi */
        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            margin-bottom: 22px;
        }

        .bank-title {
            font-size: 26px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .verified-check {
            width: 20px;
            height: 20px;
            color: #4da3ff;
        }

        /* Message va Follow tugmalari */
        .action-buttons {
            display: flex;
            gap: 14px;
            margin-bottom: 10px;
            background-color: #000000;
        }

        .btn-message {
            flex: 1;
            height: 48px;
            border-radius: 9999px;
            background-color: #000000;
            border: 1.5px solid #333639;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-follow {
            flex: 1;
            height: 48px;
            border-radius: 9999px;
            background-color: #f2f2f2;
            border: none;
            color: #0f0f0f;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Pastki navigatsiya tablari */
        .nav-tabs {
            background-color: #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #262626;
            padding-top: 4px;
        }

        .nav-tab {
            padding: 14px 12px;
            color: #71767b;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            position: relative;
            cursor: pointer;
        }

        .nav-tab.active {
            color: #ffffff;
        }

        .nav-tab.active::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: -6px;
            right: -6px;
            height: 3.5px;
            background-color: #ffffff;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div class="profile-card">
    <!-- Yuqori banner -->
    <div class="banner">
        <svg class="banner-bg-svg" viewBox="0 0 400 240" preserveAspectRatio="none">
            <defs>
                <pattern id="wavyPattern" x="0" y="0" width="40" height="80" patternUnits="userSpaceOnUse">
                    <path d="M 10 0 Q 25 20, 10 40 T 10 80" fill="none" stroke="#9be600" stroke-width="10" stroke-linecap="round"/>
                    <path d="M 30 0 Q 45 20, 30 40 T 30 80" fill="none" stroke="#a8f500" stroke-width="8" stroke-linecap="round"/>
                </pattern>
            </defs>
            <rect width="400" height="240" fill="#b4ff00"/>
            <rect width="400" height="240" fill="url(#wavyPattern)" opacity="0.75"/>
        </svg>

        <!-- Yuqori tugmalar -->
        <div class="top-controls">
            <button class="icon-btn" aria-label="Назад">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <div class="right-controls">
                <button class="icon-btn" aria-label="Уведомления">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </button>
                <button class="icon-btn" aria-label="Меню">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="5" r="2.2"/>
                        <circle cx="12" cy="12" r="2.2"/>
                        <circle cx="12" cy="19" r="2.2"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- O'ng tarafdagi 3D binafsha halqa -->
        <svg class="ring-3d-wrapper" viewBox="0 0 140 140">
            <defs>
                <radialGradient id="purpleSphere" cx="35%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#f3e8ff"/>
                    <stop offset="35%" stop-color="#9333ea"/>
                    <stop offset="80%" stop-color="#581c87"/>
                    <stop offset="100%" stop-color="#3b0764"/>
                </radialGradient>
                <linearGradient id="purpleArc" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#d8b4fe"/>
                    <stop offset="50%" stop-color="#7e22ce"/>
                    <stop offset="100%" stop-color="#4c1d95"/>
                </linearGradient>
            </defs>
            <path d="M 70 15 A 55 55 0 1 0 120 88" fill="none" stroke="url(#purpleArc)" stroke-width="18" stroke-linecap="round"/>
            <circle cx="70" cy="70" r="26" fill="url(#purpleSphere)"/>
            <circle cx="106" cy="34" r="14" fill="url(#purpleSphere)"/>
        </svg>

        <!-- Markazdagi matn va yulduzcha -->
        <div class="banner-content">
            <div class="banner-text">
                <svg class="sparkle-3d" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f5d0fe"/>
                            <stop offset="45%" stop-color="#a855f7"/>
                            <stop offset="100%" stop-color="#4c1d95"/>
                        </linearGradient>
                    </defs>
                    <path d="M50 2 C55 38, 62 45, 98 50 C62 55, 55 62, 50 98 C45 62, 38 55, 2 50 C38 45, 45 38, 50 2 Z" fill="url(#starGrad)" stroke="#e9d5ff" stroke-width="2"/>
                </svg>

                <div class="text-line-1">Всё</div>
                <div class="text-line-2">будет</div>
                <div class="text-line-3">ОТП</div>
            </div>
        </div>

        <div class="age-badge">A+</div>
    </div>

    <!-- Pastki qora panel -->
    <div class="bottom-sheet">
        <div class="avatar-container">
            <svg width="74" height="74" viewBox="0 0 100 100">
                <path d="M 50 14 A 36 36 0 1 0 84 62" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="14" fill="#000000"/>
                <circle cx="75" cy="27" r="9.5" fill="#000000"/>
            </svg>
        </div>

        <div class="title-row">
            <h1 class="bank-title">ОТП Банк</h1>
            <svg class="verified-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>

        <!-- Message va Follow tugmalari -->
        <div class="action-buttons">
            <button class="btn-message">Message</button>
            <button class="btn-follow">Follow</button>
        </div>
    </div>

    <!-- Pastki navigatsiya tablari -->
    <div class="nav-tabs">
        <div class="nav-tab active">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="3.5"/>
                <line x1="8" y1="9.5" x2="15" y2="9.5"/>
                <line x1="8" y1="14" x2="12" y2="14"/>
            </svg>
            <span>Posts</span>
        </div>

        <div class="nav-tab" aria-label="Replies">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
        </div>

        <div class="nav-tab" aria-label="Reposts">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="17 1 21 5 17 9"/>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                <polyline points="7 23 3 19 7 15"/>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
        </div>

        <div class="nav-tab" aria-label="Media">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="6" width="18" height="14" rx="3"/>
                <line x1="6" y1="3" x2="18" y2="3"/>
                <polygon points="10.5 10 15.5 13 10.5 16 10.5 10" fill="currentColor" stroke="none"/>
            </svg>
        </div>
    </div>
</div>

</body>
</html>
