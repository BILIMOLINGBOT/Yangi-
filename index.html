<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javlonbek — Профиль</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #ffffff;
        }

        .profile-card {
            width: 100%;
            max-width: 480px;
            background-color: #000000;
            overflow: hidden;
            position: relative;
        }

        /* Kichiklashtirilgan banner (115px) */
        .banner {
            height: 115px;
            background-color: #1a2436;
            position: relative;
            overflow: hidden;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Yuqori boshqaruv tugmalari */
        .top-controls {
            position: absolute;
            top: 12px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 15;
        }

        .right-controls {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Avatar: odam rasmi (40% bannerda, 60% qora fonda) */
        .avatar-container {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            background-color: #222222;
            border: 5px solid #000000;
            position: absolute;
            left: 20px;
            top: 97px;
            transform: translateY(-40%);
            z-index: 20;
            overflow: hidden;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Pastki qora panel */
        .bottom-sheet {
            background-color: #000000;
            border-top-left-radius: 18px;
            border-top-right-radius: 18px;
            margin-top: -18px;
            position: relative;
            z-index: 10;
            padding: 14px 20px 18px 20px;
        }

        /* Avatar o'ng tomonidagi Javlonbek yozuvi va tasdiqlash belgisi */
        .profile-name-row {
            margin-left: 120px;
            min-height: 52px;
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 16px;
        }

        .user-title {
            font-size: 23px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .verified-badge-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* 30 Obunachilar, 50 Obunalar qismi */
        .stats-row {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        .stat-item strong {
            color: #ffffff;
            font-weight: 700;
        }

        .stat-item span {
            color: #71767b;
        }

        /* Message va Follow tugmalari */
        .action-buttons {
            display: flex;
            gap: 14px;
            margin-bottom: 10px;
            background-color: #000000;
        }

        .btn-message {
            flex: 1;
            height: 46px;
            border-radius: 9999px;
            background-color: #000000;
            border: 1.5px solid #333639;
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-follow {
            flex: 1;
            height: 46px;
            border-radius: 9999px;
            background-color: #f2f2f2;
            border: none;
            color: #0f0f0f;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Pastki navigatsiya tablari */
        .nav-tabs {
            background-color: #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-top: 4px;
        }

        .nav-tab {
            padding: 14px 12px;
            color: #71767b;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .nav-tab.active {
            color: #ffffff;
        }

        /* Tasdiqlash belgisi sozlamasi qismi */
        .section {
            padding: 16px 20px;
        }

        .settings-group {
            background-color: #16181c;
            border-radius: 14px;
            padding: 14px 16px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .setting-icon svg {
            width: 24px;
            height: 24px;
            display: block;
        }

        .setting-content {
            flex: 1;
        }

        .setting-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-track {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #333639;
            border-radius: 34px;
            transition: 0.25s;
        }

        .toggle-track::before {
            content: "";
            position: absolute;
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: 0.25s;
        }

        .toggle-switch input:checked + .toggle-track {
            background-color: #1d9bf0;
        }

        .toggle-switch input:checked + .toggle-track::before {
            transform: translateX(20px);
        }

        .setting-description {
            font-size: 13px;
            color: #71767b;
            margin-top: 8px;
            padding: 0 4px;
        }
    </style>
</head>
<body>

<div class="profile-card">
    <!-- Banner -->
    <div class="banner">
        <img class="banner-img" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80" alt="Banner foni">

        <!-- Yuqori tugmalar -->
        <div class="top-controls">
            <button class="icon-btn" aria-label="Orqaga">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <div class="right-controls">
                <button class="icon-btn" aria-label="Bildirishnomalar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </button>
                <button class="icon-btn" aria-label="Menyu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="5" r="2.2"/>
                        <circle cx="12" cy="12" r="2.2"/>
                        <circle cx="12" cy="19" r="2.2"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Avatar doira: odam rasmi -->
    <div class="avatar-container">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Javlonbek">
    </div>

    <!-- Pastki qora panel -->
    <div class="bottom-sheet">
        <!-- Javlonbek va uning yonidagi tasdiqlash belgisi -->
        <div class="profile-name-row">
            <h1 class="user-title">Javlonbek</h1>
            <span class="verified-badge-icon" id="profileVerifiedBadge">
                <svg width="22" height="22" viewBox="0 0 24 24">
                    <path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" fill="#ffffff" stroke="none"></path>
                    <path d="m9 12 2 2 4-4" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </span>
        </div>

        <!-- 30 Obunachilar, 50 Obunalar -->
        <div class="stats-row">
            <div class="stat-item"><strong>30</strong> <span>Obunachilar</span></div>
            <div class="stat-item"><strong>50</strong> <span>Obunalar</span></div>
        </div>

        <!-- Message va Follow tugmalari -->
        <div class="action-buttons">
            <button class="btn-message">Message</button>
            <button class="btn-follow">Follow</button>
        </div>
    </div>

    <!-- Pastki navigatsiya tablari -->
    <div class="nav-tabs">
        <div class="nav-tab active" aria-label="Posts">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="3.5"/>
                <line x1="8" y1="9.5" x2="15" y2="9.5"/>
                <line x1="8" y1="14" x2="12" y2="14"/>
            </svg>
        </div>

        <div class="nav-tab" aria-label="Replies">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
        </div>

        <div class="nav-tab" aria-label="Reposts">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="17 1 21 5 17 9"/>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                <polyline points="7 23 3 19 7 15"/>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
        </div>

        <div class="nav-tab" aria-label="Media">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="6" width="18" height="14" rx="3"/>
                <line x1="6" y1="3" x2="18" y2="3"/>
                <polygon points="10.5 10 15.5 13 10.5 16 10.5 10" fill="currentColor" stroke="none"/>
            </svg>
        </div>
    </div>

    <!-- Tasdiqlash belgisi sozlamasi -->
    <div class="section">
        <div class="settings-group">
            <div class="setting-item" id="verifiedRow">
                <div class="setting-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" fill="#ffffff" stroke="none"></path>
                        <path d="m9 12 2 2 4-4" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </div>
                <div class="setting-content">
                    <span class="setting-title">Tasdiqlash belgisi</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="verifiedToggle" checked>
                    <span class="toggle-track"></span>
                </label>
            </div>
        </div>
        <p class="setting-description">Profil yonida tasdiqlangan hisob belgisini ko‘rsatish.</p>
    </div>
</div>

<script>
    const verifiedToggle = document.getElementById('verifiedToggle');
    const profileVerifiedBadge = document.getElementById('profileVerifiedBadge');

    verifiedToggle.addEventListener('change', () => {
        profileVerifiedBadge.style.display = verifiedToggle.checked ? 'inline-flex' : 'none';
    });
</script>

</body>
</html>
